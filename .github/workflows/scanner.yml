name: Trend-Pullback Scanner (24/7 Accurate Version)

on:
  schedule:
    - cron: "0 */6 * * * "   # Har 6 ghante baad naya runner start hoga
  workflow_dispatch:        # Aap manually bhi kisi bhi waqt start kar sakte hain

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # 5.8 ghante tak computer active rahega

    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Dependencies install karo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scanner chalao
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python myscanner.py
