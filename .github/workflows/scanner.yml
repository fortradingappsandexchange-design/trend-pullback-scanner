name: Trend-Pullback Scanner

on:
  schedule:
    - cron: "*/15 * * * *"   # Har 15 minute baad chalega
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Dependencies install karo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scanner chalao
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # <-- Aapka secret name yahan map ho gaya
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python myscanner.py
