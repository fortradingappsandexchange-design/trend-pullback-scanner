name: Trend-Pullback Scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # ⚡ OPTIMIZATION 1: Timeout set kiya

    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4
        with:
          clean: true   # ⚡ OPTIMIZATION 2: Har baar fresh file clean checkout karega

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'  # ⚡ OPTIMIZATION 3: Dependencies cache karega

      - name: Dependencies install karo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scanner chalao
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python myscanner.py
