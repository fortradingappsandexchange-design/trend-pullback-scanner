# Ye file GitHub repo me is exact path par jaani chahiye:
#   .github/workflows/scanner.yml
#
# Isse GitHub Actions har 5 minute me automatically scanner.py chalayega.
# Bilkul FREE hai (public/private repo dono me kaafi free minutes milte hain).

name: Trend-Pullback Scanner

on:
  schedule:
    - cron: "*/5 * * * *"   # Har 5 minute me chalega (UTC time)
  workflow_dispatch:         # Manually bhi "Run workflow" button se chala sakte ho

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies install karo
        run: pip install -r requirements.txt

      - name: Scanner chalao
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
