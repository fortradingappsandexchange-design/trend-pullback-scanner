name: Trend-Pullback Scanner (WhatsApp Version)

on:
  schedule:
    - cron: "*/15 * * * *"   # Yeh bhi har 15 minute baad chalega
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Dependencies install karo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scanner chalao
        env:
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_TO_NUMBER: ${{ secrets.WHATSAPP_TO_NUMBER }}
        run: python myscanner_whatsapp.py   # <-- Yeh nayi WhatsApp wali script chalaye ga
